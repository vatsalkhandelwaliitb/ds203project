name: Verify DS203 code
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify delivery bytes before regeneration
        run: python verify_delivery.py
      - name: Install exact dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Reproduce command-line analysis and tests
        run: |
          python analysis.py
          python tests/check_results.py
      - name: Execute in a genuinely restarted Jupyter kernel
        run: |
          python execute_notebook.py --clean-outputs
          python tests/check_results.py
